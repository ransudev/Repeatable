[package]
name = "repeatable"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui-phosphor = "0.5.0"
rdev = "0.5"
enigo = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
rfd = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
image = "0.24"
winres = "0.1"
